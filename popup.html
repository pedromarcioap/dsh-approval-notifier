<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSH — Aviso de aprovação</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <span class="dot" aria-hidden="true"></span>
      <div>
        <h1>Aviso de aprovação</h1>
        <p class="subtitle">DeepSeek Harness · localhost:3080</p>
      </div>
    </header>

    <section class="card">
      <label class="row" for="enabled">
        <span>
          <strong>Ativar avisos</strong>
          <small>Notificação do Chrome quando a conversa espera uma decisão.</small>
        </span>
        <input id="enabled" type="checkbox" />
      </label>

      <label class="row" for="onlyWhenUnfocused">
        <span>
          <strong>Só quando a janela não estiver em foco</strong>
          <small>Evita aviso redundante se você já está olhando o chat.</small>
        </span>
        <input id="onlyWhenUnfocused" type="checkbox" />
      </label>
    </section>

    <p class="status" id="status" role="status" aria-live="polite">Verificando…</p>

    <button id="test" type="button" class="button">Enviar notificação de teste</button>

    <p class="hint">
      Para ver o alerta, recarregue a página do DSH depois de instalar a extensão.
      Se nada aparecer, verifique se o Windows não está bloqueando notificações do
      Chrome (Assistente de Foco).
    </p>

    <script src="popup.js"></script>
  </body>
</html>
